name: Build NyxPet APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk nyxpet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nyxpet-apk
          path: nyxpet.apk

      # Download link for the tablet:
      # https://github.com/<you>/<repo>/releases/latest/download/nyxpet.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NyxPet build ${{ github.run_number }}
          files: nyxpet.apk
          make_latest: true
